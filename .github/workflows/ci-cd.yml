name: CI/CD Global Infrastructure

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]
  workflow_dispatch:

env:
  PROJECT_PATH: /opt/geosandbox-infrastructure
  DOCKER_NETWORK: global-network-geosandbox
  DOMAIN_BASE: gepsandbox-global-infra.com
  KONG_SUBDOMAIN: api
  RABBITMQ_SUBDOMAIN: rabbitmq
  ELASTICSEARCH_SUBDOMAIN: search

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required tools
        shell: bash
        run: |
          set -e
          command -v docker
          docker --version
          docker compose version

      - name: Ensure shared Docker network for validation
        shell: bash
        run: |
          set -e
          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || docker network create "$DOCKER_NETWORK"

      - name: Validate Root Docker Compose (compose.yaml)
        shell: bash
        run: |
          set -e
          echo "Validating compose.yaml and all included modules..."
          docker compose -f compose.yaml config > /tmp/compose-check.txt

      - name: Validate Kong declarative config
        shell: bash
        run: |
          set -e
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/api-gateway/kong.yml:/kong.yml:ro" \
            -e KONG_DATABASE=off \
            kong:latest \
            kong config parse /kong.yml

  deploy:
    name: Deploy to Self-Hosted VM
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/development'
    runs-on: self-hosted
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        shell: bash
        run: |
          set -e
          sudo mkdir -p "$PROJECT_PATH"
          sudo chown -R "$(id -un):$(id -gn)" "$PROJECT_PATH"
          rsync -a --delete "${GITHUB_WORKSPACE}/" "$PROJECT_PATH/"

      - name: Ensure Elasticsearch kernel parameter (vm.max_map_count)
        shell: bash
        run: |
          set -e
          CURRENT_MAP_COUNT=$(sysctl -n vm.max_map_count || echo 0)
          if [ "$CURRENT_MAP_COUNT" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
            if ! grep -q "vm.max_map_count" /etc/sysctl.conf; then
              echo "vm.max_map_count=262144" | sudo tee -a /etc/sysctl.conf
            fi
          fi

      - name: Ensure shared Docker network
        shell: bash
        run: |
          set -e
          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || docker network create "$DOCKER_NETWORK"

      - name: Deploy Infrastructure from Root compose.yaml
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -e
          docker compose -f compose.yaml up -d --remove-orphans

      - name: Configure reverse proxy subdomains
        shell: bash
        run: |
          set -e
          sudo mkdir -p /etc/nginx/conf.d
          sudo tee /etc/nginx/conf.d/geosandbox.conf >/dev/null <<EOF
          server {
              listen 80;
              server_name ${KONG_SUBDOMAIN}.${DOMAIN_BASE};

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }

          server {
              listen 80;
              server_name ${RABBITMQ_SUBDOMAIN}.${DOMAIN_BASE};

              location / {
                  proxy_pass http://127.0.0.1:15672;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }

          server {
              listen 80;
              server_name ${ELASTICSEARCH_SUBDOMAIN}.${DOMAIN_BASE};

              location / {
                  proxy_pass http://127.0.0.1:9200;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          EOF

          if command -v nginx >/dev/null 2>&1; then
            sudo nginx -t
            sudo nginx -s reload || sudo systemctl reload nginx
          else
            echo "nginx not installed; configure reverse proxy manually on the VM."
          fi

      - name: Health checks
        shell: bash
        run: |
          set -e
          wait_for_http() {
            local name="$1"
            local url="$2"
            local attempts=60

            echo "Waiting for ${name} at ${url}"
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if curl --fail --silent --show-error "$url" >/dev/null 2>&1; then
                echo "${name} is ready"
                return 0
              fi
              sleep 5
            done

            echo "${name} did not become ready after $((attempts * 5)) seconds"
            return 1
          }

          wait_for_http "Kong Admin API" http://127.0.0.1:8001/status
          wait_for_http "RabbitMQ Management" http://127.0.0.1:15672
          wait_for_http "Elasticsearch Cluster" http://127.0.0.1:9200/_cluster/health
          echo "Infrastructure deployment completed successfully."
