services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: global-rabbitmq
    restart: always
    ports:
      - "5672:5672" # Port Protokol AMQP
      - "15672:15672" # Port RabbitMQ Management Dashboard UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
