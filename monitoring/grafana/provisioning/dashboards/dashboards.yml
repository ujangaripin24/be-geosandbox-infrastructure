apiVersion: 1

providers:
  - name: "global-infrastructure-service"
    orgId: 1
    folder: "Global Infrastructure Service"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/definitions

providers:
  - name: "global-database-service"
    orgId: 2
    folder: "Global Database Service"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/database
