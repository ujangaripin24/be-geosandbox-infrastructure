_format_version: "3.0"
_transform: true

# Declarative Infrastructure Configuration for Kong API Gateway

# 1. Upstream Services Definition
services:
  - name: example-service
    url: https://httpbin.org
    routes:
      - name: example-route
        paths:
          - /api/v1/example
        strip_path: true

  - name: mock-geojson-service
    url: https://geojson.org
    routes:
      - name: mock-geojson-route
        paths:
          - /api/v1/geojson
        strip_path: true
        
  - name: auth-service-geosandbox
    url: http://auth_service_app:3610
    routes:
      - name: auth-service-route
        paths:
          - /api/v1/auth
        strip_path: false

# 2. Global Plugins Definition
plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      credentials: true
      max_age: 3600
